<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Blackjack Table</h1>

  <div id="table">
    <div id="dealer-area">
      <h2>Dealer</h2>
      <div class="cards" id="dealer-cards"></div>
      <div id="dealer-value"></div>
    </div>

  <div id="scoreboard" style="position:absolute; top:10px; right:10px; text-align:left;"></div>

  <div id="timers">
    <div id="ready-timer"></div>
    <div id="choosing-timer"></div>
  </div>

  <div id="players-area">
    <!-- players will be rendered here dynamically -->
  </div>

  </div>

  <div id="controls">
    <button id="joinBtn">Join Game</button>
    <button id="readyBtn" disabled>Ready</button>
    <button id="hitBtn" disabled>Hit</button>
    <button id="standBtn" disabled>Stand</button>
    <button id="shuffleBtn">Shuffle Deck</button>
    <button id="resetBtn">Reset</button> 
    <button id="leaveBtn">Leave Table</button>

  </div>

  <label class="toggle-switch">
    <input type="checkbox" id="readyTimerToggle" checked>
    <span class="slider"></span>
    <span class="label-text">Auto Ready </span>
  </label>

  <div id="deck-info">
    <div id="deck">
      <img src="asset/img/back_cards/card_back_black.png" alt="deck pile" class="pile-img">
      <span id="deck-count">0</span>
    </div>
    <div id="discard">
      <img src="asset/img/back_cards/card_back_black.png" alt="discard pile" class="pile-img">
      <span id="discard-count">0</span>
    </div>
  </div>

  <!-- Settings Icon -->
  <div id="settings-icon" title="Host Settings" 
      style="cursor:pointer; font-size:24px; position:fixed; top:10px; left:10px; z-index:1000;">
    ⚙️
  </div>

  <!-- Host Settings Box -->
  <div id="host-settings" 
      style="display:none; position:fixed; top:50px; left:10px; 
              background-color: rgba(0,0,0,0.7); color:white; padding:20px; 
              border-radius:10px; width:250px; z-index:1000;">
    <div id="host-controls">
      <!-- Host-only controls go here -->
      <label>Always Shuffle:
        <select id="alwaysShuffle">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </label>

      <div style="margin-top:10px;">
        <label>Choosing Time (sec):
          <input type="number" id="choosingTimeInput" min="5" max="120" value="30">
        </label><br>
        <label>Ready Time (sec):
          <input type="number" id="readyTimeInput" min="3" max="30" value="10">
        </label><br>
        <label>Quick Ready Time (sec):
          <input type="number" id="quickReadyTimeInput" min="1" max="10" value="3">
        </label><br>
        <button id="updateTimersBtn">Update Timers</button>
      </div>
    </div>
    <div id="non-host-message" style="display:none; text-align:center;">
      You are not the host.
    </div>
  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
